<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Cestáky</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3a;
    --accent: #00e5a0;
    --accent2: #ff4d6a;
    --accent3: #ffd166;
    --text: #e8e8f0;
    --muted: #7070a0;
    --radius: 14px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    overscroll-behavior: none;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 0 80px;
  }

  /* HEADER */
  .header {
    padding: 52px 20px 16px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .header-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 36px;
    letter-spacing: -1px;
    text-transform: uppercase;
    line-height: 1;
  }
  .header-title span { color: var(--accent); }
  .header-sub { font-size: 12px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 20px 20px;
  }
  .tab {
    flex: 1;
    padding: 9px 4px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  /* SCREENS */
  .screen { display: none; padding: 0 20px; }
  .screen.active { display: block; }

  /* BIG BUTTON */
  .ride-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .status-dot.running {
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .status-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .status-label.running { color: var(--accent); }

  .timer-display {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 56px;
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 8px;
    color: var(--text);
  }
  .timer-display.running { color: var(--accent); }
  .start-time-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    min-height: 18px;
  }

  .big-btn {
    width: 100%;
    padding: 20px;
    border-radius: 12px;
    border: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }
  .big-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .big-btn:active::after { opacity: 0.1; }

  .btn-start {
    background: var(--accent);
    color: #000;
    box-shadow: 0 8px 32px rgba(0,229,160,0.3);
  }
  .btn-stop {
    background: var(--accent2);
    color: #fff;
    box-shadow: 0 8px 32px rgba(255,77,106,0.3);
  }

  /* STOP FORM */
  .stop-form { display: none; }
  .stop-form.visible { display: block; }
  .form-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 8px;
  }
  .form-input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    margin-bottom: 14px;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--muted); }

  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }

  .btn-confirm {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 4px;
    transition: all 0.15s;
  }
  .btn-confirm:active { transform: scale(0.98); }

  /* INFO CHIPS */
  .info-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chip .chip-icon { font-size: 14px; }
  .chip strong { color: var(--text); font-weight: 600; }

  /* LAST TRIP */
  .section-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  /* TRIPS LIST */
  .trip-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    position: relative;
  }
  .trip-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .trip-customer {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--text);
  }
  .trip-date {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
  }
  .trip-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .trip-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .trip-badge.city { color: var(--accent3); border-color: rgba(255,209,102,0.3); background: rgba(255,209,102,0.07); }
  .trip-badge.time { color: var(--accent); border-color: rgba(0,229,160,0.3); background: rgba(0,229,160,0.07); }
  .trip-badge.km { color: var(--accent2); border-color: rgba(255,77,106,0.3); background: rgba(255,77,106,0.07); }
  .trip-delete {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
    opacity: 0.5;
    transition: opacity 0.15s;
  }
  .trip-delete:hover { opacity: 1; }

  .no-trips {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
  }
  .no-trips .big-icon { font-size: 48px; margin-bottom: 12px; }
  .no-trips p { font-size: 15px; line-height: 1.6; }

  /* EXPORT SCREEN */
  .month-selector {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .month-nav {
    background: none;
    border: none;
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    padding: 4px 8px;
    -webkit-tap-highlight-color: transparent;
    border-radius: 8px;
    transition: background 0.15s;
  }
  .month-nav:active { background: var(--surface2); }
  .month-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }
  .stat-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 32px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-value.green { color: var(--accent); }
  .stat-value.yellow { color: var(--accent3); }
  .stat-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

  .export-btn {
    width: 100%;
    padding: 18px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    text-align: center;
    margin-bottom: 10px;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .export-btn:active { transform: scale(0.98); }
  .export-btn.primary {
    background: var(--accent3);
    color: #000;
    border-color: var(--accent3);
    box-shadow: 0 8px 24px rgba(255,209,102,0.25);
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: #000;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
    padding: 12px 24px;
    border-radius: 40px;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.error { background: var(--accent2); color: #fff; }

  /* SCROLLABLE LIST */
  .trips-scroll { max-height: calc(100vh - 280px); overflow-y: auto; }

  @media (prefers-color-scheme: light) {
    /* keep dark anyway – it's a driver tool */
  }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div>
      <div class="header-title">Cestá<span>ky</span></div>
      <div class="header-sub">Pracovní jízdy</div>
    </div>
    <div id="headerMonth" style="text-align:right; font-size:13px; color:var(--muted);"></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showScreen('record')">⏱ Jízda</button>
    <button class="tab" onclick="showScreen('history')">📋 Historie</button>
    <button class="tab" onclick="showScreen('export')">📤 Export</button>
  </div>

  <!-- SCREEN: RECORD -->
  <div class="screen active" id="screen-record">

    <div class="ride-card">
      <div class="status-row">
        <div class="status-dot" id="statusDot"></div>
        <div class="status-label" id="statusLabel">Připraven</div>
      </div>

      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <div class="start-time-label" id="startTimeLabel"></div>

      <div id="info-chips-container" class="info-chips" style="display:none">
        <div class="chip"><span class="chip-icon">📍</span><span id="chipStart">—</span></div>
      </div>

      <button class="big-btn btn-start" id="mainBtn" onclick="handleMainBtn()">
        START
      </button>
    </div>

    <!-- STOP FORM -->
    <div class="stop-form" id="stopForm">
      <div class="ride-card">
        <div class="section-label">Dokončení jízdy</div>

        <label class="form-label">Zákazník / Firma</label>
        <input class="form-input" id="inputCustomer" type="text" placeholder="např. ACME s.r.o." autocomplete="off">

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Místo</label>
            <input class="form-input" id="inputCity" type="text" placeholder="Praha 5" autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label">Km (volitelné)</label>
            <input class="form-input" id="inputKm" type="number" placeholder="0" inputmode="numeric">
          </div>
        </div>

        <label class="form-label">Účel jízdy</label>
        <input class="form-input" id="inputPurpose" type="text" placeholder="Schůzka / servis / obchodní" autocomplete="off">

        <button class="btn-confirm" onclick="confirmStop()">✓ Uložit jízdu</button>
      </div>
    </div>

  </div>

  <!-- SCREEN: HISTORY -->
  <div class="screen" id="screen-history">
    <div class="section-label" style="padding-top:4px">Všechny záznamy</div>
    <div class="trips-scroll" id="tripsList"></div>
  </div>

  <!-- SCREEN: EXPORT -->
  <div class="screen" id="screen-export">

    <div class="month-selector">
      <button class="month-nav" onclick="changeExportMonth(-1)">‹</button>
      <div class="month-name" id="exportMonthName">—</div>
      <button class="month-nav" onclick="changeExportMonth(1)">›</button>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-value green" id="statCount">0</div>
        <div class="stat-label">Jízd</div>
      </div>
      <div class="stat-box">
        <div class="stat-value yellow" id="statKm">0</div>
        <div class="stat-label">Km celkem</div>
      </div>
      <div class="stat-box" style="grid-column:1/-1">
        <div class="stat-value" id="statTime" style="font-size:26px">0h 0m</div>
        <div class="stat-label">Celkový čas za volantem</div>
      </div>
    </div>

    <button class="export-btn primary" onclick="exportCSV()">
      <span>📊</span> Stáhnout CSV pro Excel
    </button>
    <button class="export-btn" onclick="exportText()">
      <span>📝</span> Textový přehled (kopírovat)
    </button>

    <div style="margin-top:16px; padding:16px; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius);">
      <div class="section-label">Jak dostat do Excelu</div>
      <p style="font-size:13px; color:var(--muted); line-height:1.7;">
        1. Stáhni CSV soubor<br>
        2. Otevři Excel → Data → Načíst data ze souboru<br>
        3. Oddělovač: <strong style="color:var(--text)">středník (;)</strong><br>
        4. Zkopíruj do své šablony
      </p>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────
let trips = JSON.parse(localStorage.getItem('cestaky_trips') || '[]');
let activeTrip = JSON.parse(localStorage.getItem('cestaky_active') || 'null');
let timerInterval = null;
let exportMonth = new Date();
exportMonth.setDate(1);

// ─── INIT ─────────────────────────────────────────────────────────────
function init() {
  updateHeaderDate();
  updateExportMonth();
  renderHistory();

  if (activeTrip) {
    setRunningUI();
  }
}

function updateHeaderDate() {
  const now = new Date();
  document.getElementById('headerMonth').textContent =
    now.toLocaleDateString('cs-CZ', { month: 'long', year: 'numeric' });
}

// ─── SCREENS ──────────────────────────────────────────────────────────
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'history') renderHistory();
  if (name === 'export') updateExportStats();
}

// ─── MAIN BUTTON ──────────────────────────────────────────────────────
function handleMainBtn() {
  if (!activeTrip) {
    startTrip();
  } else {
    showStopForm();
  }
}

function startTrip() {
  const now = new Date();
  activeTrip = {
    id: Date.now(),
    startTime: now.toISOString(),
    startLabel: formatDateTime(now),
  };
  localStorage.setItem('cestaky_active', JSON.stringify(activeTrip));
  setRunningUI();
  showToast('Jízda zahájena 🚗');
}

function setRunningUI() {
  const btn = document.getElementById('mainBtn');
  btn.className = 'big-btn btn-stop';
  btn.textContent = 'STOP';

  document.getElementById('statusDot').classList.add('running');
  document.getElementById('statusLabel').classList.add('running');
  document.getElementById('statusLabel').textContent = 'Probíhá jízda';
  document.getElementById('timerDisplay').classList.add('running');
  document.getElementById('startTimeLabel').textContent = 'Začátek: ' + activeTrip.startLabel;
  document.getElementById('info-chips-container').style.display = 'flex';
  document.getElementById('chipStart').textContent = activeTrip.startLabel;

  startTimer();
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
}

function updateTimer() {
  if (!activeTrip) return;
  const start = new Date(activeTrip.startTime);
  const diff = Math.floor((Date.now() - start) / 1000);
  const h = Math.floor(diff / 3600);
  const m = Math.floor((diff % 3600) / 60);
  const s = diff % 60;
  document.getElementById('timerDisplay').textContent =
    pad(h) + ':' + pad(m) + ':' + pad(s);
}

function showStopForm() {
  document.getElementById('stopForm').classList.add('visible');
  document.getElementById('mainBtn').style.display = 'none';
  setTimeout(() => document.getElementById('inputCustomer').focus(), 100);
}

function confirmStop() {
  const customer = document.getElementById('inputCustomer').value.trim();
  const city = document.getElementById('inputCity').value.trim();
  const km = document.getElementById('inputKm').value.trim();
  const purpose = document.getElementById('inputPurpose').value.trim();

  if (!customer) { showToast('Zadej zákazníka!', true); return; }
  if (!city) { showToast('Zadej místo!', true); return; }

  const now = new Date();
  const start = new Date(activeTrip.startTime);
  const durationSec = Math.floor((now - start) / 1000);

  const trip = {
    id: activeTrip.id,
    date: start.toLocaleDateString('cs-CZ'),
    startTime: activeTrip.startLabel,
    endTime: formatDateTime(now),
    startISO: activeTrip.startTime,
    endISO: now.toISOString(),
    customer,
    city,
    km: km || '',
    purpose: purpose || '',
    durationSec,
    durationLabel: formatDuration(durationSec),
  };

  trips.unshift(trip);
  localStorage.setItem('cestaky_trips', JSON.stringify(trips));

  // Reset
  activeTrip = null;
  localStorage.removeItem('cestaky_active');
  clearInterval(timerInterval);
  resetRecordUI();
  showToast('Jízda uložena ✓');
}

function resetRecordUI() {
  document.getElementById('mainBtn').className = 'big-btn btn-start';
  document.getElementById('mainBtn').textContent = 'START';
  document.getElementById('mainBtn').style.display = '';
  document.getElementById('statusDot').classList.remove('running');
  document.getElementById('statusLabel').classList.remove('running');
  document.getElementById('statusLabel').textContent = 'Připraven';
  document.getElementById('timerDisplay').classList.remove('running');
  document.getElementById('timerDisplay').textContent = '00:00:00';
  document.getElementById('startTimeLabel').textContent = '';
  document.getElementById('info-chips-container').style.display = 'none';
  document.getElementById('stopForm').classList.remove('visible');
  document.getElementById('inputCustomer').value = '';
  document.getElementById('inputCity').value = '';
  document.getElementById('inputKm').value = '';
  document.getElementById('inputPurpose').value = '';
}

// ─── HISTORY ──────────────────────────────────────────────────────────
function renderHistory() {
  const el = document.getElementById('tripsList');
  if (!trips.length) {
    el.innerHTML = `<div class="no-trips">
      <div class="big-icon">🚗</div>
      <p>Zatím žádné záznamy.<br>Zmáčkni START před každou jízdou.</p>
    </div>`;
    return;
  }

  el.innerHTML = trips.map((t, i) => `
    <div class="trip-card">
      <div class="trip-card-header">
        <div class="trip-customer">${esc(t.customer)}</div>
        <div class="trip-date">${esc(t.date)}</div>
      </div>
      <div class="trip-meta">
        <span class="trip-badge city">📍 ${esc(t.city)}</span>
        <span class="trip-badge time">⏱ ${esc(t.durationLabel)}</span>
        ${t.km ? `<span class="trip-badge km">🛣 ${esc(t.km)} km</span>` : ''}
        ${t.purpose ? `<span class="trip-badge">💼 ${esc(t.purpose)}</span>` : ''}
      </div>
      <div style="margin-top:8px;font-size:12px;color:var(--muted)">${esc(t.startTime)} → ${esc(t.endTime)}</div>
      <button class="trip-delete" onclick="deleteTrip(${i})">✕</button>
    </div>
  `).join('');
}

function deleteTrip(idx) {
  if (!confirm('Smazat tuto jízdu?')) return;
  trips.splice(idx, 1);
  localStorage.setItem('cestaky_trips', JSON.stringify(trips));
  renderHistory();
  updateExportStats();
  showToast('Jízda smazána');
}

// ─── EXPORT ───────────────────────────────────────────────────────────
function getMonthTrips() {
  const y = exportMonth.getFullYear();
  const m = exportMonth.getMonth();
  return trips.filter(t => {
    const d = new Date(t.startISO);
    return d.getFullYear() === y && d.getMonth() === m;
  });
}

function updateExportMonth() {
  const months = ['Leden','Únor','Březen','Duben','Květen','Červen',
                  'Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
  document.getElementById('exportMonthName').textContent =
    months[exportMonth.getMonth()] + ' ' + exportMonth.getFullYear();
  updateExportStats();
}

function changeExportMonth(dir) {
  exportMonth.setMonth(exportMonth.getMonth() + dir);
  updateExportMonth();
}

function updateExportStats() {
  const mt = getMonthTrips();
  document.getElementById('statCount').textContent = mt.length;
  const totalKm = mt.reduce((s, t) => s + (parseFloat(t.km) || 0), 0);
  document.getElementById('statKm').textContent = totalKm || '—';
  const totalSec = mt.reduce((s, t) => s + (t.durationSec || 0), 0);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  document.getElementById('statTime').textContent = `${h}h ${m}m`;
}

function exportCSV() {
  const mt = getMonthTrips();
  if (!mt.length) { showToast('Žádné jízdy v tomto měsíci', true); return; }

  const bom = '\uFEFF';
  const header = ['Datum','Zákazník','Místo','Začátek','Konec','Trvání','Km','Účel'];
  const rows = mt.map(t => [
    t.date, t.customer, t.city, t.startTime, t.endTime, t.durationLabel, t.km || '0', t.purpose || ''
  ].map(v => `"${String(v).replace(/"/g,'""')}"`));

  const csv = bom + [header, ...rows].map(r => r.join(';')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  const months = ['ledna','unora','brezna','dubna','kvetna','cervna',
                  'cervence','srpna','zari','rijna','listopadu','prosince'];
  a.href = url;
  a.download = `cestaky_${exportMonth.getFullYear()}_${String(exportMonth.getMonth()+1).padStart(2,'0')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV staženo 📊');
}

function exportText() {
  const mt = getMonthTrips();
  if (!mt.length) { showToast('Žádné jízdy v tomto měsíci', true); return; }

  const months = ['Leden','Únor','Březen','Duben','Květen','Červen',
                  'Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
  let text = `CESTOVNÍ PŘÍKAZY – ${months[exportMonth.getMonth()]} ${exportMonth.getFullYear()}\n`;
  text += '='.repeat(50) + '\n\n';

  mt.forEach((t, i) => {
    text += `${i+1}. ${t.date} – ${t.customer}\n`;
    text += `   Místo: ${t.city}\n`;
    text += `   Čas: ${t.startTime} → ${t.endTime} (${t.durationLabel})\n`;
    if (t.km) text += `   Km: ${t.km}\n`;
    if (t.purpose) text += `   Účel: ${t.purpose}\n`;
    text += '\n';
  });

  const total = mt.reduce((s,t) => s + (parseFloat(t.km)||0), 0);
  const totalSec = mt.reduce((s,t) => s + (t.durationSec||0), 0);
  text += '─'.repeat(50) + '\n';
  text += `Celkem jízd: ${mt.length}\n`;
  text += `Celkem km: ${total || '—'}\n`;
  text += `Celkový čas: ${formatDuration(totalSec)}\n`;

  navigator.clipboard.writeText(text)
    .then(() => showToast('Zkopírováno do schránky 📋'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Zkopírováno 📋');
    });
}

// ─── HELPERS ──────────────────────────────────────────────────────────
function formatDateTime(d) {
  return d.toLocaleDateString('cs-CZ') + ' ' +
    d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
}

function formatDuration(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m} min`;
}

function pad(n) { return String(n).padStart(2, '0'); }

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg, error = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (error ? ' error' : '');
  setTimeout(() => { el.className = 'toast'; }, 2800);
}

init();
</script>
</body>
</html>
